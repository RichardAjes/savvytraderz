<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HORC-SAVVY Journal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#f3eee4;--card:#fbf8f2;--ink:#1d1b17;--mut:#7a7466;--line:#ddd5c4;--acc:#a86a12;--up:#2b7a4b;--dn:#b03a2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13120e;--card:#1c1a15;--ink:#ece6d6;--mut:#9a927f;--line:#2f2b22;--acc:#e3b04b;--up:#5cc489;--dn:#ef7d6e}}
:root[data-theme="dark"]{--bg:#13120e;--card:#1c1a15;--ink:#ece6d6;--mut:#9a927f;--line:#2f2b22;--acc:#e3b04b;--up:#5cc489;--dn:#ef7d6e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif}
#app{max-width:980px;margin:0 auto;padding:16px 14px 40px}
h1{font:600 26px 'Fraunces',Georgia,serif;margin:0;letter-spacing:-.3px}
h2{font:600 17px 'Fraunces',Georgia,serif;margin:0 0 10px}
.mono,td.n,.k b{font-family:'IBM Plex Mono',ui-monospace,monospace}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
nav button{background:none;border:0;padding:10px 14px;color:var(--mut);font:inherit;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--ink);border-color:var(--acc)}
button,select,input,textarea{font:inherit;color:var(--ink)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:500}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.k span{display:block;color:var(--mut);font-size:12px}.k b{font-size:19px;font-weight:500}
.up{color:var(--up)}.dn{color:var(--dn)}
.ch{width:100%;height:180px;display:block}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:var(--acc)}
.bar.w i{background:var(--dn)}.bar.g i{background:var(--up)}
.lbl{display:flex;justify-content:space-between;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;color:var(--mut);font-weight:400;font-size:12px;padding:4px 8px 4px 0;white-space:nowrap}
td{padding:6px 8px 6px 0;border-top:1px solid var(--line);white-space:nowrap}td.n{text-align:right}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.msgs{max-height:340px;overflow-y:auto;margin-bottom:10px}
.msg{padding:8px 11px;border-radius:8px;margin-bottom:8px;white-space:pre-wrap;font-size:14px}
.msg.u{background:var(--line);margin-left:24px}.msg.ai{border:1px solid var(--line)}
.toast{background:var(--card);border:1px solid var(--dn);color:var(--dn);padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:14px}
.note{color:var(--mut);font-size:13px}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}
.shot{max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:8px;display:block}
.runf{display:contents}.runf[hidden]{display:none}
.toast.ok{border-color:var(--up);color:var(--up)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal em{font-style:normal;text-align:center;color:var(--mut);font-size:12px}
.d{min-height:54px;border:1px solid var(--line);border-radius:6px;padding:3px 5px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;overflow:hidden}
.d i{font-style:normal;color:var(--mut)}.d b{font-weight:500;font-size:11px;text-align:right}
.d.gu{background:color-mix(in srgb,var(--up) 20%,transparent)}.d.gd{background:color-mix(in srgb,var(--dn) 20%,transparent)}
[hidden]{display:none!important}
</style></head>
<body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=(n,d=2)=>(n<0?'-':'')+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const SG=n=>(n>0?'+':'')+F(n);
const cl=n=>n>0?'up':n<0?'dn':'';
const today=()=>new Date().toLocaleDateString('en-CA');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const cleanSym=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9._]/g,'').slice(0,20);
const DEF=['XAUUSD','EURUSD','GBPUSD','USDCAD','US30','NASDAQ','UK100','NZDUSD','JP225','AUDUSD'];
const SES=['Asia','London','New York','Other'];
const LS='tj_v1';
let S={cfg:{accounts:[{id:'a1',name:'Main',start:10000,daily:5,maxdd:10,target:10}],instruments:DEF.slice()},trades:{},plans:{},imgs:{}};
let U={tab:'dash',acc:null,sym:DEF[0],busy:false,stream:null,err:'',ok:'',edit:null,loading:true,gate:false,cal:0,myName:''};
let user=null,ME=null;const NAMES={};
let db=null,C=null,C2=null,sample=null,pending=false;

const use=async n=>{try{return window.claude?await claude.use(n):null}catch(e){return null}};
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function saveCfg(){C?C.doc('cfg').set(S.cfg).catch(console.error):lsSave();render()}
function putTrade(t){S.trades[t.id]=t;C?C.doc('t_'+t.id).set(t).catch(console.error):lsSave()}
function delTrade(id){delete S.trades[id];C?(C.doc('t_'+id).delete().catch(console.error),C2&&C2.doc('su_'+id).delete().catch(()=>{}),C2&&C2.doc('rv_'+id).delete().catch(()=>{})):lsSave();render()}
const IMG={};
function putPlan(p){S.plans[p.id]=p;C?C.doc('p_'+p.id).set(p).catch(console.error):lsSave()}
const LOCK=7*864e5,locked=p=>Date.now()-p.savedAt>LOCK;
const plansFor=s=>Object.values(S.plans).filter(p=>p.sym===s&&p.savedAt).sort((a,b)=>b.savedAt-a.savedAt);
const shown=()=>U.draft&&U.draft.sym===U.sym?null:(S.plans[U.view]?.sym===U.sym?S.plans[U.view]:plansFor(U.sym)[0]||null);
const D=ms=>new Date(ms).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const getImg=id=>IMG[id]??S.imgs?.[id];
async function storeImg(id,img){IMG[id]=img;if(C2)await C2.doc(id).set({d:img});else{(S.imgs??={})[id]=img;lsSave()}}
async function hydrate(){for(const el of document.querySelectorAll('img[data-id]')){const id=el.dataset.id;let d=getImg(id);if(!d&&C2){try{const x=await C2.doc(id).get();d=x.exists?x.data().d:null;if(d)IMG[id]=d}catch(e){}}if(d)el.src=d;else el.alt='Screenshot unavailable'}}
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);
 for(const w of [1400,1100,900,700]){const sc=Math.min(1,w/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  for(const q of [.7,.55,.4]){const d=c.toDataURL('image/jpeg',q);if(d.length<190000)return res(d)}}rej(new Error('big'))};im.onerror=()=>rej(new Error('bad'));im.src=u})}
const acct=()=>S.cfg.accounts.find(a=>a.id===U.acc)||S.cfg.accounts[0];
const allT=()=>Object.values(S.trades);
function tradesFor(id){return allT().filter(t=>t.acc===id&&t.status!=='open').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0))}
function stats(a){const T=tradesFor(a.id);let eq=a.start,peak=eq,dd=0,w=0,rs=[],pts=[eq],day={};
 T.forEach(t=>{eq+=t.pnl;pts.push(eq);peak=Math.max(peak,eq);dd=Math.max(dd,peak-eq);if(t.pnl>0)w++;if(t.risk>0)rs.push(t.pnl/t.risk);day[t.date]=(day[t.date]||0)+t.pnl});
 return{T,eq,pts,dd,w,n:T.length,avgR:rs.length?rs.reduce((x,y)=>x+y,0)/rs.length:null,today:day[today()]||0}}
function group(T,k){const m={};T.forEach(t=>{const g=m[t[k]]??={n:0,w:0,pnl:0};g.n++;g.pnl+=t.pnl;if(t.pnl>0)g.w++});return Object.entries(m).sort((a,b)=>b[1].pnl-a[1].pnl)}

function chart(p){if(p.length<2)return'<p class="note">No trades yet. Add one in the Journal tab.</p>';
 const W=640,H=180,q=8,mn=Math.min(...p),mx=Math.max(...p),r=(mx-mn)||1;
 const x=i=>q+i*(W-2*q)/(p.length-1),y=v=>H-q-(v-mn)/r*(H-2*q);
 const d=p.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
 return`<svg class="ch" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}L${x(p.length-1)} ${H}L${x(0)} ${H}Z" fill="var(--acc)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function rule(label,used,lim,cls){if(!lim)return'';const pc=Math.min(100,used/lim*100);
 return`<div class="lbl"><span>${label}</span><span class="mono">${F(used)}% / ${F(lim)}%</span></div><div class="bar ${cls||(pc>=80?'w':'')}"><i style="width:${pc}%"></i></div>`}
const gt=(rows)=>rows.length?`<div class="sc"><table><tr><th></th><th>Trades</th><th>Win</th><th>P/L</th></tr>${rows.map(([k,g])=>`<tr><td>${esc(k)}</td><td class="n">${g.n}</td><td class="n">${Math.round(g.w/g.n*100)}%</td><td class="n ${cl(g.pnl)}">${SG(g.pnl)}</td></tr>`).join('')}</table></div>`:'<p class="note">Nothing yet.</p>';

function head(a){return`<header><div><h1>HORC-SAVVY Journal</h1>${U.myName?`<div class="note">Signed in as ${esc(U.myName)}</div>`:''}</div><div class="row"><select id="acc">${S.cfg.accounts.map(x=>`<option value="${x.id}"${x.id===a.id?' selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn" data-a="editacc" data-v="${a.id}">Limits</button><button class="btn" data-a="editacc" data-v="new">+ Account</button><button class="btn" data-a="editacc" data-v="manage">Manage</button></div></header>
${C?'':'<p class="note">Sign in to sync your private data across devices. Until then it is saved on this device only.</p>'}
<nav>${[['dash','Dashboard'],['jour','Journal'],['plan','Plan'],['rules','Rules'],['feed','Friends']].map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${U.tab===k?'on':''}">${l}</button>`).join('')}</nav>`}
function manageV(){const A=S.cfg.accounts;return`<div class="card"><h2>Accounts</h2>${A.map(x=>{const T=allT().filter(t=>t.acc===x.id),last=T.map(t=>t.date).sort().pop(),act=x.id===U.acc;
 return`<div class="lbl" style="padding:8px 0;border-top:1px solid var(--line);gap:8px;flex-wrap:wrap"><span><b>${esc(x.name)}</b> <span class="note">${T.length} trades${last?' · last '+esc(last):''}</span></span>${act?'<span class="note">Active</span>':A.length<2?'':U.confirm===x.id?`<span class="row"><span class="dn note">Delete its ${T.length} trades too?</span><button class="btn" data-a="delacc" data-v="${x.id}">Confirm</button><button class="btn" data-a="noconfirm">Cancel</button></span>`:`<button class="btn" data-a="askdel" data-v="${x.id}">Remove</button>`}</div>`}).join('')}<p class="note">Switch to another account to remove the active one. Removing an account also deletes its trades and cannot be undone.</p><button class="btn" data-a="canceledit">Close</button></div>`}
function editor(){if(U.edit==='manage')return manageV();const n=U.edit==='new',a=n?{name:'',start:10000,daily:5,maxdd:10,target:10}:S.cfg.accounts.find(x=>x.id===U.edit);if(!a)return'';
 return`<div class="card"><h2>${n?'New account':'Account settings'}</h2><div class="form"><label class="note">Name<input id="e_name" value="${esc(a.name)}"></label><label class="note">Start balance<input id="e_start" type="number" value="${a.start}"></label><label class="note">Daily loss limit %<input id="e_daily" type="number" step="0.1" value="${a.daily}"></label><label class="note">Max drawdown %<input id="e_max" type="number" step="0.1" value="${a.maxdd}"></label><label class="note">Profit target %<input id="e_tgt" type="number" step="0.1" value="${a.target}"></label></div>
<div class="row" style="margin-top:10px"><button class="btn p" data-a="saveacc" data-v="${n?'new':a.id}">Save</button><button class="btn" data-a="canceledit">Cancel</button>${!n&&S.cfg.accounts.length>1?`<button class="btn" data-a="delacc" data-v="${a.id}">Delete account</button>`:''}</div><p class="note">Drawdown is measured peak-to-trough as a % of the start balance. Set 0 to hide a rule.</p></div>`}

function dash(a){const s=stats(a),pl=s.eq-a.start,op=openFor(a.id),fp=op.reduce((x,t)=>x+flo(t),0);
 return revCard()+runCard(a)+`<div class="kpis"><div class="k"><span>Running</span><b>${op.length}</b></div><div class="k"><span>Floating P/L</span><b class="${cl(fp)}">${SG(fp)}</b></div><div class="k"><span>Balance</span><b>${F(s.eq)}</b></div><div class="k"><span>Net P/L</span><b class="${cl(pl)}">${SG(pl)}</b></div><div class="k"><span>Return</span><b class="${cl(pl)}">${a.start?SG(pl/a.start*100):'0.00'}%</b></div><div class="k"><span>Win rate</span><b>${s.n?Math.round(s.w/s.n*100):0}%</b></div><div class="k"><span>Avg R</span><b>${s.avgR==null?'n/a':F(s.avgR)}</b></div><div class="k"><span>Max drawdown</span><b class="${s.dd?'dn':''}">${F(s.dd)}</b></div></div>
<div class="card"><h2>Equity curve</h2>${chart(s.pts)}</div>
<div class="card"><h2>Prop rules</h2>${rule('Daily loss today',Math.max(0,-s.today)/a.start*100,a.daily)}${rule('Max drawdown',s.dd/a.start*100,a.maxdd)}${rule('Profit target',Math.max(0,pl)/a.start*100,a.target,'g')||'<p class="note">Set limits with the Limits button.</p>'}</div>
<div class="two"><div class="card"><h2>By pair</h2>${gt(group(s.T,'sym'))}</div><div class="card"><h2>By session</h2>${gt(group(s.T,'session'))}</div></div><div class="card"><h2>By liquidity</h2>${gt(group(s.T.filter(t=>t.liq),'liq'))}</div>${loseCard(a,s)}${cal(a,s)}<button class="btn" data-a="sharej">Share my journey with friends</button>`}

function jour(a){const T=tradesFor(a.id).slice().reverse().slice(0,100);
 return warnCard()+revCard()+runCard(a)+`<div class="card"><h2>Plan the trade: journal it before you enter</h2><div class="form"><input id="t_date" type="date" value="${today()}"><select id="t_sym">${S.cfg.instruments.map(i=>`<option>${esc(i)}</option>`).join('')}</select><select id="t_side"><option>Buy</option><option>Sell</option></select><select id="t_ses">${SES.map(i=>`<option>${i}</option>`).join('')}</select><input id="t_risk" type="number" step="any" placeholder="Risk ($, required)"><input id="t_note" placeholder="Note"><div class="runf" id="runf"><input id="t_entry" type="number" step="any" placeholder="Entry"><input id="t_tp" type="number" step="any" placeholder="Target"><input id="t_sl" type="number" step="any" placeholder="Stop-loss"></div><label class="note" style="grid-column:1/-1">What liquidity is calling price?<select id="t_liq" style="display:block;width:100%"><option value="">Select…</option>${LIQ.map(x=>`<option>${x}</option>`).join('')}</select></label><div id="liqreq" style="grid-column:1/-1"></div><div style="grid-column:1/-1"><p class="note">Setup screenshot (required)</p><label class="btn">Upload setup screenshot<input id="t_shot" type="file" accept="image/*" hidden></label><img id="t_prev" class="shot" ${U.setup?`src="${U.setup}"`:'hidden'} alt=""></div></div>
<div class="row" style="margin-top:10px"><button class="btn p" data-a="addtrade">Open running trade</button><label class="btn">Import CSV<input id="file" type="file" accept=".csv,.txt" hidden></label><button class="btn" data-a="export">Export CSV</button></div>
<p class="note">Every trade starts as a running position. It closes automatically when the price you enter reaches the target or stop-loss. Use CSV import for past trades.</p><p class="note">CSV needs a header row. Recognised columns: date, symbol, type/side, profit, risk, session, comment. New symbols are added automatically.</p></div>
<div class="card"><h2>Trades</h2>${T.length?`<div class="sc"><table><tr><th>Date</th><th>Pair</th><th>Side</th><th>Session</th><th>R</th><th>P/L</th><th>Plan</th><th>Note</th><th></th></tr>${T.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.sym)}</td><td>${esc(t.side)}</td><td>${esc(t.session)}</td><td class="n">${t.risk>0?F(t.pnl/t.risk):''}</td><td class="n ${cl(t.pnl)}">${SG(t.pnl)}</td><td>${planTag(t)}</td><td>${esc((t.note||'').slice(0,40))}</td><td><button class="btn" data-a="rev" data-v="${t.id}">${t.rev?'Review':'Review needed'}</button> <button class="x" data-a="deltrade" data-v="${t.id}" aria-label="Delete">×</button></td></tr>`).join('')}</table></div>`:'<p class="note">No trades yet.</p>'}</div>`}

const fields=(b,t,ro,p)=>`<select id="${p}bias" style="margin-bottom:8px" ${ro?'disabled':''}>${['','Bullish','Bearish','Neutral'].map(x=>`<option value="${x}"${b===x?' selected':''}>${x||'Bias: not set'}</option>`).join('')}</select><textarea id="${p}text" rows="9" ${ro?'readonly':''} placeholder="Drivers, key levels, catalysts, scenarios, what invalidates the idea">${esc(t)}</textarea>`;
function planV(){const all=plansFor(U.sym),P=shown(),d=U.draft&&U.draft.sym===U.sym?U.draft:null;
 const topH=`<div class="chips">${S.cfg.instruments.map(i=>`<button class="chip ${i===U.sym?'on':''}" data-a="sym" data-v="${esc(i)}">${esc(i)}</button>`).join('')}</div>
<div class="row" style="margin-bottom:14px"><input id="newsym" placeholder="Add pair, e.g. USDJPY" style="width:190px"><button class="btn" data-a="addsym">Add pair</button><button class="btn" data-a="rmsym">Remove ${esc(U.sym)}</button></div>`;
 let body='';
 if(d)body=`<div class="card"><h2>New ${esc(U.sym)} plan</h2>${fields(d.bias,d.text,false,'d')}<p class="note">TradingView screenshot (required to save)</p>${d.img?`<img class="shot" src="${d.img}" alt="">`:''}<div class="row" style="margin:8px 0"><label class="btn">${d.img?'Replace':'Upload'} screenshot<input id="dimg" type="file" accept="image/*" hidden></label></div><div class="row"><button class="btn p" data-a="saveplan" ${d.img?'':'disabled'}>Save plan</button><button class="btn" data-a="canceldraft">Cancel</button></div></div>`;
 else if(!P)body=`<div class="card"><h2>${esc(U.sym)}</h2><p class="note">No plan yet.</p><button class="btn p" data-a="newplan">New plan</button></div>`;
 else{const lk=locked(P);P.chat??=[];
  const chat=P.chat.map(m=>`<div class="msg ${m.role==='user'?'u':'ai'}">${esc(m.content)}</div>`).join('')+(U.stream!==null?`<div class="msg ai" id="stream">${esc(U.stream)||'Thinking…'}</div>`:'');
  body=`<div class="two"><div class="card"><h2>${esc(U.sym)} plan</h2><p class="note">${P.closedAt?'Closed':'Active'} · saved ${D(P.savedAt)} · ${lk?'locked since '+D(P.savedAt+LOCK):'editable until '+D(P.savedAt+LOCK)}</p>${fields(P.bias,P.text,lk,'p')}<img class="shot" id="shot" data-id="${P.id}" alt="">
  <div class="row" style="margin-top:10px">${lk?'':'<label class="btn">Replace screenshot<input id="pimg" type="file" accept="image/*" hidden></label>'}<button class="btn" data-a="newplan">${P.closedAt?'New plan':'Plan exhausted: open new'}</button>${P!==all[0]?'<button class="btn" data-a="latest">Back to latest</button>':''}<button class="btn" data-a="shareplan">Share plan</button></div></div>
